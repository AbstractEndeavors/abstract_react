e resulting polarization of the Jews\nwith one side supporting orthodox Judaism and one side\nworking to undermine it.\n\nThat there existed a secret oral tradition claiming to\nbe the teaching of Moses, but contrary to the Law, could\n\nexplain why \u2018many Jewish people \u201cwere so quick to\nforsake the written Law of Moses and join in worshiping\n\n14\n\nChapter 3\n\nAncient Oral Traditions\n\n\"Wise Men\" have existed who", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 19", "page_title": "batch:3", "page_keywords": "mysteries, tradition, moses, wise, people, jews, traditions, counsel, insurrection, workers, iniquity, psalm, times, knowledge"}, {"n": 20, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0020/image.png", "text": "Acceptance of the worship of heathen deities often\nled to grossly immoral practices, even to human sacrifice\nas in the worship of Molech. It is a sad commentary that\neven Solomon fell into idol worship in his old age (I\n\nKings 11:1-8).\n\nAfter the death of Solomon the kingdom was divided\ninto the Northern Kingdom of ten tribes (Israel) and the\nSouthern Kingdom of two tribes (Judah). Immediately,\nIsrael rejected the Law of Moses and turned to worship\nof the Golden Calf, an Egyptian deity. The Northern\nKingdom lasted about 200 years until it was destroyed\nby Assyria in 721 B.C. Every one of its 19 kings\nfollowed the worship of the Golden Calf.\n\nJudah, the Southern Kingdom, lasted slightly more\nthan 300 years, and as was noted previously, was\ndestroyed by Babylon about 600 B.C. Most of its Kings\nalso worshiped idols. Only a few revered the Law of\n\nMoses.\n\nrejection of the Law of Moses is attested to in the\nwritings of Old Testament prophets. Jeremiah denounced\nthe existence of such a movement in his day. This is\n\nAnd the Lord said unto me, A conspiracy is found\namong the of\norganized murder on a basis of religious fervor, and\nunleashed a reign of terror throughout the East. Years\nlater, in secret records released by two of their own\nleaders, a list was found of celebrated men of all nations\nwho had been their victims.\n\nEventually, the leaders of the Assassins turned on\neach other and became the victims of the poisons and\ndaggers they had prepared for others. Although the\ndynasty of the Assassins had ended by 1250, the sects\nfrom which they derived continued.\n\nThe Knights Templar is another example of the end\nresults of secret societies. After the First Crusade had\n\nended with the defeat of the Muslims and the capture of\nJerusalem, a band of nine Frenchmen formed an order (in\n1118) for the protection of pilgrims to the Holy\nSepulchre. The King of Jerusalem presented them with\n\n21\n\nSecret Societies", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 26", "page_title": "batch:0", "page_keywords": "assassins, paradise, grand, master, leaders, victims, societies, jerusalem, garden, resting, places, streams"}, {"n": 27, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0027/image.png", "text": "a house near the Temple of Solomon resulting in the\nname Knights Templar. The Templars were bound by a\nvow of poverty and were to live solely on alms. But\ndonations became so enormous that they eventually\nabandoned their vow of poverty and spread themselves\nover Europe. By the end of the twelfth century they had\nbecome a rich and powerful body.\n\nBy the end of the thirteenth century the rumors of\ntheir unscrupulous deeds and low moral life caused them\n\neo\n\nto become suspect in the eyes of the clergy and the\ngeneral public, word of their apostasy even reaching the\nPope.\n\nOn October 13, 1307, the King of France had all of\nthe Templars in France arrested. Many confessed that\nthey had been ordered to spit on the crucifix and had\nbeen urged to commit obscenities and practice unnatural\nvice. Later, and without duress of any kind, these\n\nconfessions were repeated before the Pope by seventy-\ntwo of the French Knights.\n\nm\n\nSimilar to other secret societies, the Templars had a\ndouble doctrine. The one presented to the majority of\nmembers at the lower level, and to the public, was\nreplete with noble endeavors. If a member was able to\n\nascend to a higher level by proving to his unscrupulous\nsuperiors that he could be trusted to keep their secrets\nand carry out their orders, he was told more about the\ntrue purpose of the order. These evil designs were most\noften communicated orally. The outward profession\n\n22\n\nThe Secret Side of History", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 27", "page_title": "batch:1", "page_keywords": "templars, knights, poverty, century, public, pope, france, level, house, temple, solomon, templar, alms, donations"}, {"n": 28, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0028/image.png", "text": "Some writers believed that the Templars believed in\na god of good and a god of evil but chose to serve the\ngod of evil (Lucifer) because they thought him to be\nmore powerful and able to make them rich. Nesta H.\n\nTheir most fervent worship was addressed to this god\nof evil, who alone could enrich them. \"They said with the\nLuciferians: The elder son of God, Satanael or Lucifer\nalone has a right to the homage of mortals; Jesus his\nyounger brother does not deserve this honour.\"\n\nThe Templars not only became international bankers\nin their day, they also supported uprisings against\nexisting governments to a point of threatening world\nwide revolution. As we progress to our study of the\nMystery Babylon of Revelation, we will see that history\nrepeats itself.\n\nIt has been tragic for the human race \"that secret\n\noperating in secrecy, have been able to involve large\nnumbers of well-meaning followers at the lower levels\n\nwho, in working for the goals of the organization, were\npaving the way for their own destruction. This pattern is\nmore evident in the twentieth century than at any other\n\ntime in history.\nJust as there existed secret and subversive sects\n\n23\n\nSecret Societies\n\ncontained nothing but perfect orthodoxy. The inside or\n\nsecret profession was anti-Christian.\n\nWebster gives the following quotation:\n\nsocieties, with a small number of leaders always\n\nworking against Christianity and orthodox Judaism, there", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 28", "page_title": "batch:2", "page_keywords": "evil, templars, lucifer, history, secret, societies, writers, good, nesta, worship, luciferians, satanael, right"}, {"n": 29, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0029/image.png", "text": "were also secret movements organized for the purpose of\nundermining all moral and religious beliefs in the minds\nof Muslims. These began in the middle of the seventh\ncentury resulting in an immense schism in Islam that led\nto open warfare.\n\nAn important faction to rise out of the many splits was\nthe Ismailis who up to about A.D. 872 remained\nbelievers. At this time Abdullah ibn Maymun, an\nintriguer of extraordinary cunning, succeeded in\ncapturing control of the movement which then became\nsubversive, not only of Islamism, but of all religious\nbeliefs. The Ismailis movement became a model for the\n\norganization of modern secret societies.\n\nThe first open acts of violence resulting from the\ndoctrines of Abdullah were carried out by the\nKarmathites, a secret society named after its leader\nKarmath. Karmath, a bora schemer who believed in\nnothing, became the leader of the Karmathites in Arabia\n\nsociety.\n\nKarmath persuaded his followers to give all of their\nmoney to him and establish a community of goods and\nwives. Becoming absolute master of their minds, he led\nthem away from all religion and released them from all\nthe duties of piety, devotion, and the fear of God. This\nwas just the opposite of what he had prescribed for them\nbefore they were \"enlightened.\"\n\nHe permitted them pillage (robbery by violent means),\nand every sort of immoral license, teaching that they\n\n24\n\nThe Secret Side of History\n\nwhere a number of Arabs were soon enlisted in the", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 29", "page_title": "batch:3", "page_keywords": "karmath, beliefs, minds, ismailis, abdullah, movement, karmathites, society, leader, movements, purpose, muslims, middle, century"}, {"n": 30, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0030/image.png", "text": "could pillage the goods and shed the blood of their\nadversaries with impunity.\n\nPeaceful fraternity was thus turned into a wild lust for\nconquest as the Karmathites became a band of robbers,\npillaging and massacring throughout all the surrounding\ndistricts. Nesta Webster quotes von Kammer as saying:\n\nFor a whole century the pernicious doctrines of\nKarmath raged with fire and sword in the very bosom of\nIslamism, until the wide spread conflagration was\nextinguished in blood.*\n\n25\n\nSecret Societies", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 30", "page_title": "batch:4", "page_keywords": "blood, goods, adversaries, impunity, fraternity, lust, conquest, karmathites, band, robbers, pillaging, districts, nesta"}, {"n": 31, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The rder was the\nuntimely death of one of its members, an evangelist\npreacher named Lanze, who, while on a mission to\nSilesia, was struck down by lightning. Instructions found\non his body resulted in a raid on the houses of two of the\nleading members of the Order. Here much mcriminating\nevidence was uncovered, among which was a list of\n\nAlthough Weishaupt was banished from Bavaria, and\nthe Order was officially suppressed, the Order simply\nwent underground and emerged as a network of Reading\nSocieties throughout Germany. The goal of this network\nwas to monopolize the writing, publication, reviewing,\nand distribution of all literature, as a means of controlling\n\nFrom the very beginning, the Illuminati was a secret\nsociety within a secret society, beginning in the Masonic\nLodge Theodore of Munich, Germany of which\nWeishaupt was a member. It was his plan to use the\n\n27\n\nThe Illuminati\n\nUsing the methods of earlier secret societies,\n\npoisons.\n\nthe minds of the readers.", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 32", "page_title": "batch:1", "page_keywords": "order, weishaupt, illuminati, means, methods, bavaria, members, network, societies, germany, society, organizing, ability"}, {"n": 33, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0033/image.png", "text": "propagate his philosophy.\n\nMasonic Lodges in France and Germany during the\n18th century became breeding grounds for revolution.\nIdeological evolution within the French lodges brought\nforth the Jacobin Clubs of revolutionary fame.\n\nIt is important to distinguish between Freemasonry in\nEurope, especially France, from Freemasonry in England\nand America where, historically, and today, its members\nare usually characterized by high standards of morality\nand spirituality.\n\nTo recruit members into the Order Weishaupt advised\n\nSeek out t Prince\nKropotkin in 1908:\n\nWhat we learn to-day from the study of the Great\nRevolution,... is that it was the source and origin of all the\npresent communist, anarchist, and socialist\n\npresent communist, anarchist, and socialist\nconceptions.... up till now, modern socialism has added\nabsolutely nothing to the ideas that were circulating\namong the French people between 1789 and 1794, and\nwhich it was tried to put into practice in the year II. of\nthe Republic. Modern socialism has only systematized\nthose ideas and found arguments in their favor, .. . |\n\nanarchist,\n\nsocialist\n\npresent\n\nIndeed, the French Revolution was a source for\ncommunist, anarchist, and socialist conceptions;\nconceptions that, when carried to conclusion, resulted in\nthe necessity of installing drainage systems to carry away\nthe torrents of blood that flowed from French guillotines.\nThese same \"conceptions\" applied during the twentieth\ncentury have resulted in the murder of well over one\nhundred million human beings. There is much to learn\nfrom the Great Revolution. Commenting on the\n\nnm ame. . RY. ord\n\nand\n\nsocialist\n\nIf, then, we would discover the truth about these\ngreat revolutionary outbreaks, we must dig down far\nbelow the surface, we must trace the connection between\nthe mine and the explosion, between the actions of the\npeople and the causes that provoked them?\n\n35\n\nThe French Revolution\n\nThat the French Revolution was a model for Socialist\n\nanarchist,\n\nRevolution, the British historian Nesta Webster wrote:", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 40", "page_title": "batch:4", "page_keywords": "revolution, anarchist, conceptions, communist, french, great, source, socialism, ideas, people"}, {"n": 41, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0041/image.png", "text": "Although ignored by most historians, especially those\nwho wished to glorify the leaders of the Revolution, the\ntruth was recorded by all factions, and preserved in\n\nprimary source documents. These documents have been\navailable to all who wished to present the truth about this\n\ndark period in world history.\n\nLord Acton said, \"The appalling thing in the French\nRevolution is not the tumult but the design.\"? The design\nthat is apparent throughout the Revolution is Adam\nWeishaupt&apos;s plan to destroy all religion, overthrow all\n\nTragically, the Revolution began at a time when great\nprogress was being made toward the reforms sought by\nthe people. The force behind the movement for reform\nwas not the revolutionaries, but King Louis XVI.\n\nTo ascertain the wishes of the people, a proclamation\nhad been sent out by the King to the whole nation saying:\n\nHis Majesty has desired that in the extremities of his\nkingdom and in the obscurest dwellings every man shall\nrest assured that his wishes and requests shall be heard.*\n\nthe country were compiled in what was known as the\n\"cahiers.\" The contents of the cahiers were summed up\n\n36\n\nThe Secret Side of History\n\ngovernments, and rule the world.\n\nThe lists of grievances that arrived from all parts of\n\nby Hua that:\n\nThe voice of the nation cried out for reform, for changes in\n\nthe government, but all proclaimed respect", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 41", "page_title": "batch:0", "page_keywords": "revolution, truth, documents, world, history, design, people, reform, king, wishes, nation, cahiers, historians"}, {"n": 42, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0042/image.png", "text": "for religion, loyalty to the King, and desire for law and\norder.\n\nUnfortunately, peaceful reform was not to be the fate\nof France. Plans for violent revolution were already far\nadvanced by what was to become known as the\nOrleaniste Conspiracy.\n\nThe principal character in the Orleaniste Conspiracy\nwas the Duke of Orleans, a nobleman of great wealth\nwho had been recruited into the Iluminati by Mirabeau.\nLured into supporting the Revolution by the hope of\nattaining the throne in place of his cousin, Louis XVI,\nand driven by his hatred of the Queen, Marie Antoinette,\nthe Duke of Orleans became a most willing tool of the\n\nconspiracy.\n\nThough hailed as \"the idol of Paris,\" the Duke of\nOrleans was actually loathed and despised by the people.\nThis was partly due to his low moral character and partly\nto his disdain for the people. It was no small task for the\nparty that supported him to convince the people that the\nman who treated them with insolence had become their\n\nchampion of liberty.\nThe election of the Duke of Orleans to Grand Master\n\nsuccess of the IIuminati&apos;s plan (plotted by Mirabeau) to\ninfiltrate Freemasonry and to use it as a base of\noperations in promoting violent revolution. Out of these\nMasonic lodges in France came the organization known\n\n37\n\nThe French Revolution\n\nof the Masonic Order in France was the crowning", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 42", "page_title": "batch:1", "page_keywords": "revolution, duke, orleans, france, conspiracy, people, order, orleaniste, character, mirabeau"}, {"n": 43, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0043/image.png", "text": "the\n\nas the Jacobin Clubs. These clubs provided the\nleadership for the events of the French Revolution.\n\nIn the beginning and throughout the Revolution, a\ncampaign of vilification was carried out against the King\nand Queen, the priests and nobles. These vilifications\ntook the part of both written slanders and oral harangues\ncalculated to stir up class hatred among the people. This\nform of propaganda was simply the implementation of\nthe big lie technique.\n\nIn addition to propaganda, it was necessary to create\na crisis to contribute to the restlessness of the people.\nThis was accomplished by the agents of the Duke of\nOrleans buying up the grain supplies and withholding\nthem from the people. By this means the threat of famine\nfaced the people and the cry of \"bread\" was added to the\ncry of liberty and equality. To add to the agitation of the\npeople, the scarcity of grain was blamed on the King and\nNobles as monopolizers. Throughout the Revolution this\n\ntactic \u2014 of always blaming your enemy for what you are\ndoing \u2014 was used.\nBut in order to start the blood of the revolution\n\nflowing it was necessary to go a step farther, the hiring\nof criminals and ruffians. These brigands from the South\nof France and Italy, known as the Marseillais, began\nflocking into Paris in the spring of 1789. Men of ferrous\nappearance, they carried thick knotted sticks and made\nup the hard core of the major uprisings that were to\nfollow.\n\n38\n\nThe Secret Side of History\n\nas the Jacobin Clubs.\n\nThese clubs", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 43", "page_title": "batch:2", "page_keywords": "people, clubs, revolution, jacobin, king, nobles, propaganda, grain, leadership, events, french, beginning, campaign, vilification"}, {"n": 44, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0044/image.png", "text": "To swell a mob of insurrection, these brigands would\ngo into the factories and workshops and compel the\n\nsurround a person, hold him tightly under the arms, and\ncarry him with them against his will.\n\nMoney, wine, and hope of plunder fired the zeal of\nthe criminals making up the hoards of brigands\ndescribed as, \"men of rapine and car me of wholesale\n\ndrowning in the Loire. The first experiment was made on\nabout ninety old priests who were placed on a barge that\nwas towed to midstream and sunk. Through cold\n\nDecember nights crowds of poor women, some carrying\nbabies, some leading children by the hand, were driven\nto the river and loaded on barges to be drowned. Carrier\nreferred to this as, \"bathing parties.\" Prudhomme placed\nthe death toll at no less than one million during this\n\nIt is important to remember that the system behind the\nReign of Terror was the plan of Robespierre to transform\nFrance into a Socialist State. There were to be no rich,\n\nno poor, only equality. Plans were put forth for every\ndepartment of life to be placed under State control. Free\n\n51\n\nThe French Revolution\n\nperiod of indiscriminate massacres.", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 56", "page_title": "batch:0", "page_keywords": "carrier, children, plan, control, river, state, order, population, people, hundreds, thousands, guillotine"}, {"n": 57, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0057/image.png", "text": "love was to replace marriage, friendships were to be\nforced upon people by law, children were to become\nproperty of the State, with the State dictating how they\nshould be raised. No area of life was to escape the\n\nwatchful eye of big brother.\nWhat had all of this done to the people of France?\nNot only had it destroyed their industries, their\n\ntheir\n\ntheir\n\nculture,\n\nand\n\ntheir\n\nfamilies,\n\nits\n\ndestruction had also reached into the very soul of France.\nA personal observation of this was told by the British\nhistorian John Robison:\n\nA most worthy and accomplished gentleman, who\ntook refuge in this country, leaving behind him his\nproperty, and friends to whom he was most tenderly\nattached, often said to n and carry out the\nmassacres of September, was sentenced to death and\nexecuted at the guillotine.\n\nMarat, who had called for the death of so many, was\nstabbed through the heart by a woman while in his own\nhome. Even after his death an unholy fascination\ncentered around him. Crowds of worshipers knelt around\nhis body, blaspheming Christ and crying out, \"Oh sacred\nheart of Marat!\" Added to the display of Satanic\nadmiration was the fact that his body decayed with\namazing rapidity immediately after his death.\n\nCarrier, who ordered the murder of innocent children,\n\nRobespierre, the chief architect of the events from\nOctober 1793 on, was the last, and died a hideous death.\n\n53\n\nThe French Revolution\n\nname a few.\n\nwas executed by the guillotine surrounded by a jeering\n\nmultitude.", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 58", "page_title": "batch:2", "page_keywords": "death, revolution, guillotine, blood, marat, heart, body, sense, loyalty, justice, list, victims, folly"}, {"n": 59, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0059/image.png", "text": "Seeing the end near, Robespierre fired a pistol at his\nhead in an attempted suicide, but only succeeded in\nfracturing his jaw. For hours he lay on a green table, the\nsame table where he and his followers had often sat\n\nplanning the death of others. As he lay with his head on\na wooden box, with blood flowing from his jaw, a\nworkingman approached, looked into the shattered face\nand exclaimed, \"There is a God!\"\n\nAt the guillotine the executioner tore away the\nbandage that was bound about his head causing the\nfractured jaw to fall, leaving a gaping chasm. The victim\nthen emitted a tortured roar of agony that was heard to\nthe farthermost extremities of the square. When his\nsevered head was held up by the executioner, men and\nwomen fell into each others arms crying, \"At last we are\nfree! The tyrant is no more!\" The Reign of Terror had\n\na4\n\nended.\n\nThe end of the Reign of Terror was not the end of\nturmoil for France. Eighty years of war and revolution\nwere to follow. The Directory (1795-1799) that\nsucceeded the Convention lasted four years and was\n\nfollow.\n\nthat\n\nto\n\nwere\n\nabolished because of its tyranny and corruption. The\nConsulate was formed (1799) and ended five years later.\nIn 1804 Napoleon became emperor and a series of\nEuropean wars followed resulting in France being\ninvaded by Russians, Austrians, and Prussians. Napoleon\nwas overthrown and France returned to a monarchy in\n1814 by calling Louis XVIII to the throne, only to be\ndeposed by Napoleon six months later. Napoleon was\n\n54\n\nThe Secret Side of History", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 59", "page_title": "batch:3", "page_keywords": "head, napoleon, france, years, table, executioner, reign, terror, robespierre, pistol, suicide, hours, followers, death"}, {"n": 60, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0060/image.png", "text": "France.\n\nLouis XVIII was recalled and served nine years until\nhis death. His was the only government that did not come\nto a violent end during the eighty year period. The reign\nof Charles X that followed was overthrown in 1830 by\n\nan uprising of the Orleanists that placed Louis Philippe\non the throne, only to be driven out after eighteen years\nof unrest. In this third revolution of 1848, a Second\n\nRepublic was proclaimed.\nNesta Webster summed up the whole affair in this\n\nManner:\n\nThe immense reforms brought about during the\nrevolutionary era were not the result of the Revolution. It\nwas to the King and his enlightened advisors . . . that the\n\n\"4 1\n\nreforms in government were primarily due; n these\n\nevents.\n\nThe painting of George Washington kneeling in the\nsnow and praying at Valley Forge did not come about as\na result of some artist s fancy, but because of the witness\n\nof Isaac Potts who, while walking through the woods,\naccidentally came across Washington praying in a grove\nof oaks. General Knox, Who was with Washington | at\n\nValley Forge, stated that Washington frequently used the\ngrove for prayer.\n\n56\n\nChapter 7\n\nThe American Republic", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 61", "page_title": "batch:0", "page_keywords": "washington, american, republic, events, valley, forge, grove, nation, lord, psalms"}, {"n": 62, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0062/image.png", "text": "When the Constitutional Convention was on the verge\nof breaking up, Benjamin Franklin stood up and made a\nmotion stating:\n\nIn the beginning of the contest with Britain, when we\nwere sensible of danger, we had daily prayers in this\nroom for the divine protection. Our prayers, Sir, were\nheard \u2014 and they were graciously answered. . . .\n\nI therefore beg leave to move that, henceforth,\nprayers imploring the assistance of heaven and its\nblessings on our deliberations be held in this assembly\nevery morning before we proceed to business, and that\none or more of the clergy of this city be requested to\nofficiate in that service.\n\nThe record is replete with examples of the Founding\nFathers&apos; reliance on, and thankfulness for, Divine\n\nIt may be far more than just a coincidence that the\nfounding of the Illuminati and the founding of the\nAmerican Republic both took place in 1776. For over a\n\nhundred years, the Republic stood as a roadblock to\nWeishaupt&apos;s scheme for his Order to rule the world.\nDuring this period, the American Republic was a shining\nexample of everything that was contrary to what the\nIlluminati and its followers were bringing upon the\n\nworld. Out of this difference has come a protracted\nstruggle between good and evil, freedom and slavery,\nwhich has continued throughout the twentieth century.\nTo understand better why the Founding Fathers\nestablished the kind of government that they did, it is\n\n57\n\nThe American Republic\n\nassistance.", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 62", "page_title": "batch:1", "page_keywords": "founding, republic, prayers, american, assistance, fathers, illuminati, world, constitutional, convention, verge"}, {"n": 63, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0063/image.png", "text": "helpful to consider the background of the Founding\nFathers themselves, the most common denominator being\ntheir Christian Faith. This is not something attributed to\nthem by others, but something established by their own\nwritings and background. Out of the fifty-five delegates\nto the Constitutional Convention, Christianity was the\n\nreligion of at least fifty. This means that 90 percent of the\ndelegates were Christians. For an excellent 415 page\nbook covering this subject, we recommend Christianity\nAnd The Constitution by John Eidsmoe published by\nBaker Book House, Grand Rapids, Michigan. To learn\nthe truth about the beliefs of the Founding Fathers,\nEidsmoe personally read 5,000 letters written by these\n\nmen.\n\nNot only were the Founding Fathers well versed in\nScripture, they were also well educated in history. One\nthing that made the founding of the American Republic\npossible was the high rate of literacy and high standard\nof education among the colonists. Eidsmoe gives us an\nidea of this level:\n\nThe high caliber of learning at that time is evident\nfrom the entrance requirements for colonial colleges. In\nthe 1700s an undergraduate freshman at William and\nMary College had to be able to read, write, converse,\nand debate in Greek. When John Jay applied for\nadmission to King&apos;s College in New York at the age of\nfourteen, one of the entrance requirements he had to\nfulfill was to translate the first ten chapters of the Gospel\nof John from Greek into Latin.\u201d\n\n58\n\nThe Secret Side of History", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 63", "page_title": "batch:2", "page_keywords": "founding, fathers, john, eidsmoe, background, delegates, christianity, book, history, entrance, requirements, college, greek"}, {"n": 64, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0064/image.png", "text": "Around 1800 a study was made on education in\nAmerica that concluded, \"Most young Americans .. . can\nread, write and cipher. Not more than four in a thousand\nare unable to write legibly \u2014 even neatly.\u201d\n\nThis high rate of literacy was a direct result of the\nreligions leaders placing a strong emphasis upon the\nimportance of being able to read the Bible. There were\nno public schools at this time.\n\nBecause of their knowledge of history, secular and\nreligious, the Founding Fathers had a profound faith in\nDivine Providence and a strong distrust in government.\nThus, they set out to establish a system of government\nthat would set men free to work out their own destiny by\nbinding rulers down \"with the chains of the\n\nbinding rulers\nConstitution.\"\n\nrulers\n\ndown\n\n\"with\n\nthe\n\nchains\n\nThe United States Constitution was not something\nhammered out over night, but was carefully written after\nmuch consideration and debate. The war with Britain\n\nended on October 19, 1781, but the Constitution was not\nratified until June 1788. Two years later, December\n1791, the Bill of Rights was adopted.\n\nTo understand better the events leading up to the\nfounding of the American Republic, and why the\nFounding Fathers gave us the kind of government they\ndid, it will be helpful to examine the Old World View of\n\nman and government.\nThis view was largely a fatalistic view that the\nindividual is helpless to determine his destiny, that he is\n\n59\n\nThe American Republic", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 64", "page_title": "batch:3", "page_keywords": "government, founding, rulers, constitution, view, fathers, destiny, chains, american, republic, study, education"}, {"n": 65, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0065/image.png", "text": "controlled by forces outside himself and can do nothing\nto improve his lot in life. Therefore, he needed a king or\nleader to guide and control him. In this stagnant world,\nwith no hope of progress, men must be herded into a\ncollective mass, a bee hive, and controlled.\n\nThis pagan view was dominant for nearly 6,000 years\nof recorded history with the result that hunger and famine\nremained a common foe for most of the inhabitants of\n\nearth. Progress was so slow that, until the time of George\nWashington, the best thing that man could come up with\nfor transportation was the horse drawn coach, and that\ncould only be afforded by the rich. Then something\namazing happened. The Old World pagan concepts were\nrejected, resulting in more progress toward a better way\nof life in less than 200 years than the accumulated\n\nprogress of 6,000 years.\n\nThe events leading up to this quantum leap forward\nactually began on the American Continent as far back as\n1660. It was during this time that the colonies began to\nrebel against the pagan Old World View of a planned\n\neconomy.\nCharles II had signed an act allowing the American\nColonies to ship cotton, lumber, tobacco, and other\nproducts to England, but only to England, nowhere else.\nThe colonists needed sugar and molasses from the West\nIndies (Cuba). Therefore, they just ignored the King&apos;s\ndecree and kept on trading wool and tobacco for sugar\nand molasses. A few of the traders&apos; ships were sunk by\n\n60\n\nThe Secret Side of History", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 65", "page_title": "batch:4", "page_keywords": "progress, world, years, life, king, view, history, time, pagan, american, colonies, tobacco, england, sugar, molasses"}, {"n": 66, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0066/image.png", "text": "In 1760 King George III came along and set out to\ncontrol every detail affecting the lives of his subjects at\nhome and abroad. The first thing he did was restrict\nemigration to the colonies and prohibit any more settlers\nfrom moving westward. The King&apos;s planning even\nincluded American trees, with the King&apos;s men going\nthrough the forest and marking the best pine to be held\nfor the royal navy.\n\nThis so irritated the colonists that they not only went\nout of their way to use the marked trees, they also\nadopted the pine tree as their symbol of liberty.\nWhenever the British government tried to place\nrestrictions on trade, the colonists went right on trading.\nWhen the weaving of cloth was prohibited in the\n\ntried\n\nto\n\ncolonies, the women went right on working at their\nlooms, with the stage being set for a confrontation until\nfinally, \"the embattled farmers\" stood at the Concord\nbridge and fired the \"the shot heard \u2018round the world.\"\n\nIt is interesting to note, that in trying to manage a\nplanned economy, the object of government regulations\nis always to prevent a fall in prices, just the opposite of\nwhat creates prosperity. What government has never\nlearned is that lower prices, not higher prices, aid the\neconomy. It is an unheeded lesson of history that\ngovernment interference in the marketplace always\n\ne484 1 \u00a5.\n\n61\n\nThe American Republic\n\nthe King&apos;s navy, but this was just considered an ordinary\n\nbusiness risk.\n\nworks to harmful ends. It never helps.", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 66", "page_title": "batch:0", "page_keywords": "king, government, prices, colonies, trees, pine, navy, colonists, economy, george, detail, lives"}, {"n": 67, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0067/image.png", "text": "Henry Grady Weaver in his book, The Mainspring of\nHuman Progress, explained how this brought down the\nRoman Empire:\n\nThe hairsplitting economic regulations were\nperfected by Diocletian, whose stern directives were so\nefficiently administered that farmers could no longer\nfarm; and many of the small businessmen, faced with\nstarvation, committed suicide in preference to being\nexecuted for black marketing.\n\nWhen there was no work, the beneficent government\nthen began to tax the rich to provide the populace with\nbread and entertainment. Eventually, so many workers\nwere forced into tax-supported relief that there was not\n\nenough production to pay the tax bills. The result; the\nRoman Empire collapsed into the dark ages.\n\nIn England, to solve the problem of over production\nof wool, Charles II decreed that no corpse could be\nburied that was not wrapped in a woolen shroud. The\nwool was buried, but ghouls dug up the corpses, stole the\nshrouds and sold them on the black market. Before\n\nAdam Smith&apos;s Wealth of Nations was published (in\n1776), and his ideas made the Industrial Revolution\npossible, England was known as an island surrounded by\n\nsmugglers.\nWeaver also quoted Buckle&apos;s comments on France:\n\nTn every quarter, esentative\ngovernment, and freedom of religion and expression on\na level never before reached by the Chinese.\n\nOn April 5, 1975, the day of a Chinese holiday when\nthe Chinese honor the memory of their ancestors, Chiang\nKai-shek left this world at 10 minutes to midnight. The\n\ncould\n\n127\n\nBabylon&apos;s War Against God\n\nobtained control of the opinion molding media in the\n\nUnited States.\n\nThis control was so effective that out of 29 books\n\nabout China written between 1943 and 1944, 22 of these\n\nfollowers. The aftermath of the establishment of two\n\nChinas then allowed the world to see the fruits of two\n\nrepresentative", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 132", "page_title": "batch:1", "page_keywords": "books, chiang, china, taiwan, procommunist, communists, chinese, religion, level, people, world, control"}, {"n": 133, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0133/image.png", "text": "man who had written in his will that, \"I have at all times\nconsidered myself a disciple of Jesus Christ,\" went to\n\nSad\n\nsee his Master. After a beautiful sunny day on April 5, at\nmidnight, just minutes after Chiang&apos;s passing, a terrible\nstorm of rain, thunder, and lightning raged over the island\ncausing sleepy Chinese everywhere to rise from their\nbeds and gaze upon the storm. Whether this was chance\nor providence, no one knows.\n\nThe tragedy of the China story is that the most\npopulous : nation on earth, a 1 nation that could have been\n\ncorm\n\none of the world&apos;s greatest examples of Christian\nleadership, was betrayed by the one nation that the world\nwould least suspect, the United States of America. As\nhas been stated by others who have commented upon this\nhorrible betrayal, \"May God forgive us!\"\n\nCuba is another example of a land where God was\n\nbanned. It is also a ed to the\nrevolutionaries. This was followed by an arms embargo\nagainst the Cuban government, and constant State\nDepartment pressure against Batista.\n\nThe top men in the State Department at this time, who\nwere members of the New York based Council on\n\nForeign Relations were: Secretary of State John Foster\nDulles, Under Secretary of State Christian Herter, and\nDeputy Under Secretary of State Robert Murphy. The\nleader of the CIA was CFR member Allen Dulles, and\nthe man who occupied the White House was CFR\n\n129\n\nBabylon&apos;s War Against God", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 134", "page_title": "batch:3", "page_keywords": "state, department, batista, cuba, secretary, leader, dictator, castro, methods, arms, dulles"}, {"n": 135, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0135/image.png", "text": "One American who became an eye witness to Castro&apos;s\ntyranny was Anthony Bryant, once a black revolutionary,\nwho while in a Cuban prison discovered the truth about\nCommunism, and at the same time discovered God.\n\nBryant made national headlines when, in 1969, he\nhijacked a passenger jetliner and diverted it from Miami\nto Havana. His objective was to obtain arms to be\nsmuggled back to the United States to be used to initiate\nguerrilla warfare here. Once in Cuba, however, Bryant\nwas arrested and charged with sedition against the Cuban\n\nGovernment. He was sentenced to 12 years in prison, not\nbecause he hijacked a jetliner or robbed the passengers\non board, but because one of the men he robbed was a\n\nsecret Cuban agent working in the United States. The\nagent had to go underground because of his exposure.\n\nAfter spending 12 years in Cuban prisons, Bryant was\namong several prisoners allowed to return to the United\nStates during a public relations campaign put on by\nCastro. Bryant th s\nof history.\n\nThe scenario against Somoza was played out as usual,\nbeginning with a massive smear campaign by the CFR-\ncontrolled media in the United States to condition the\n\nAmerican people to accept a Communist take over of\nNicaragua. Three American journalists whose\n\nNicaragua. Three American journalists whose\nperversions of truth did the most to help bring about the\ntragedy in Nicaragua were CFR member Dan Rather of\nCBS, CFR member Karen De Young of the Washington\nPost, and Alan Riding of the New York Times.\n\nBefore he was murdered, President Somoza was able\n\nwhose\n\nRather tried every conceivable journalistic trick to\ntrip me up on questions. He knew in advance the\n\n133\n\nBabylon&apos;s War Against God\n\nto relate the results of an interview with Dan Rather that\n\nwas aired in the United States on \"Sixty Minutes\":", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 138", "page_title": "batch:2", "page_keywords": "member, nicaragua, state, secretary, rights, somoza, carter, patricia, communists, united, states"}, {"n": 139, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0139/image.png", "text": "going to find the question to fit his preconceived answer.\nWell, he never succeeded. From watching the show, one\nwould never know that Dan Rather spent two and one-\nhalf hours grilling me. It&apos;s difficult to believe, but Rather\ncondensed that entire time to seven minutes. The\n\nother filming which he did in Nicaragua.\n\nI didn&apos;t realize what the power of film editing really\nmeant. With that power, Rather cast me in any role he\nchose. Every good thing I said about Nicaragua was\ndeleted. Any reference to Carter&apos;s effort to destroy the\ngovernment of Nicaragua was deleted. Every reference\nto the Communist activity and Cuba&apos;s participation was\ndeleted.&apos;\u00ae\n\nagainst the , as farmers,\nthroughout the 1800s and on through 1979, when the\nrevolution took place inside Nicaragua with outside\nCommunist influence ousting Mr. Somoza. As a result,\nthe Soviet Union moved in quickly, propped up Daniel\nOrtega, and other Sandinista leaders, which subsequently\nled to the persecution of the church inside Nicaragua.\n\nPersecution has included the burning of the Bibles in\n\na oo moa \u201d aon\n\nthe villages. The Sandinista government sees the Bible as\ncontrary to liberation theology and Marxist-Leninist\nteaching inside Nicaragua. Pastors have been killed,\nentire villages have been wiped out. In 1981, the decision\nwas made simply to eliminate 60,000 people from the\n\n135\n\nBabylon&apos;s War Against God\n\nagainst the Christian Miskito Indians when they refused\n\nDavid Courson:\n\nIn the 1840s and 1850s, missionaries from the", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 140", "page_title": "batch:4", "page_keywords": "nicaragua, indians, courson, miskito, people, david, christian, church, missionaries, sandinista, persecution, villages"}, {"n": 141, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0141/image.png", "text": "face of the earth along this area because of their refusal\nto adopt and to embrace Marxist-Leninist philosophy.\nAn example of the extent of the persecution can be\nillustrated by a 25 year old pastor by the name of Biardo,\nwho was awakened early one morning when Sandinista\ntroops came into his village. They called all of the men\ntogether outside the church, gave them shovels, had\nthem dig their own graves, and shot them in the back.\nThe women and children were taken inside the church,\nand there in front of Pastor Biardo they were violated\nand tortured in such ways that I cannot begin to describe\n\nto you today.\n\nThe pastor was mocked, tied up to a pole, spat upon,\nand the Sandinista troops said, \"Where is your God?\nWhy doesn&apos;t He ever hear you? Why doesn&apos;t He ever\nanswer your prayers?\" They set the church on fire. The\npastor was soon terribly burned on his arms, legs, his\nhands and feet; and a result of the fire was that the ropes\nthat bound him were also burned through. He was then\nable to rescue some of the people inside the church.\nThey made their way through the jungle, hiding in the\ndaytime, and traveling at night, in what has come to be\nknown as The Trail of Tears, to one of the refugee\ncamps along the Honduras Nicaragua border inside\nHonduras. That is but one example of the persecution of\nthe church in Nicaragua.&apos;\u201d\n\nThe story of Africa is another story of the betrayal of\nan entire continent into the hands of those who hate\n\nChristianity. Out of 52 nations, the vast majority are\nruled by one-party dictatorships with no chance for\ndemocratic reforms. The truth about these betrayals, and\nthe resulting war against religion, has been withheld by\n\n136\n\nThe Secret Side of History", "alt": "The-Secret-Side-of-History-Mystery-Babylon page 141", "page_title": "batch:0", "page_keywords": "church, pastor, example, persecution, biardo, sandinista, troops, fire, hands, honduras, nicaragua, story, face"}, {"n": 142, "thumb": "/home/op/Documents/python/modules/src/modules/abstract_react/src/abstract_react/repositories/viewer_module/python/test_pdfs/The-Secret-Side-of-History-Mystery-Babylon/pages/0142/image.png", "text": "the news media, and ignored by the major religious\ndenominations in America. Whenever the U. S. news\n\nmedia covered events in Africa, the news has always\nbeen slanted toward Communist goals and against\nfreedom, South Africa being the greatest victim of this\n\nbias.\n\nMissionary director Peter Hammond, a native of\nSouth Africa, related this about the moral conditions in\n\nYou hear so much bad news about South Africa,\nnone of which really bears any resemblan
